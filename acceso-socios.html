<script>
function abrirMenu() { document.getElementById('nav-menu').classList.add('abierto'); }
function cerrarMenu() { document.getElementById('nav-menu').classList.remove('abierto'); }
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
</script>

<script>
const API = "https://script.google.com/macros/s/AKfycby7ImfIXGrETzpET-ndcx5b27PPjCOnW6VGYmtgU6E3YzG6E6r94-r0WklKbc5cK_3h/exec";
const ADMIN_NUM = "0011";

async function validarAcceso(event) {
    event.preventDefault();
    const btn = document.querySelector("button[type='submit']");
    const textoOriginal = btn.innerText;
    btn.innerText = "Verificando...";
    btn.disabled = true;

    const numRaw  = document.getElementById("numSocio").value.trim();
    const passRaw = document.getElementById("passSocio").value.trim();

    // Número siempre 4 dígitos con ceros
    const numFormateado = numRaw.padStart(4, '0');
    // PIN: intentar tal cual y sin ceros (por si la Sheet lo guarda como número)
    const pinConCeros   = passRaw.padStart(4, '0');
    const pinSinCeros   = String(parseInt(passRaw, 10));

    try {
        // 1.º intento: PIN tal como lo escribe el socio (con ceros si los pone)
        let res  = await fetch(`${API}?action=getSocio&num=${numFormateado}&pin=${pinConCeros}`);
        let data = await res.json();

        // 2.º intento: sin ceros iniciales (Sheets a veces guarda 344 en vez de 0344)
        if (!data.ok) {
            res  = await fetch(`${API}?action=getSocio&num=${numFormateado}&pin=${pinSinCeros}`);
            data = await res.json();
        }

        if (data.ok && data.socio) {
            // Guardar el PIN que funcionó para llamadas posteriores a la API
            const pinValido = data.ok ? pinConCeros : pinSinCeros;
            const datosSesion = {
                num:    numFormateado,
                nombre: data.socio.nombre,
                pin:    pinValido
            };
            localStorage.setItem("datos_sesion", JSON.stringify(datosSesion));
            window.location.href = "panel-socio.html";
        } else {
            alert("Número de socio o contraseña incorrectos.\n\nRecuerda:\n· Nº socio: 4 dígitos (ej: 0003)\n");
            btn.innerText = textoOriginal;
            btn.disabled  = false;
        }
    } catch(e) {
        alert("Error de conexión. Inténtalo de nuevo.");
        btn.innerText = textoOriginal;
        btn.disabled  = false;
    }
}
</script>
