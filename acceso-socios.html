<body>

<header>
    <div class="cabecera-flex">
        <h1>Acceso Socios</h1>

<nav>

<div class="zona-scroll">
<div class="hero">
    <div class="hero-contenido">
        <img src="peña1.jpeg" class="logo-hero">
        <div class="hero-texto">Área Privada</div>
    </div>
</div>

<div class="contenedor">
    <h2>Identificación</h2>

    <form onsubmit="validarAcceso(event)">
        <label>Número de Socio</label>
        <input type="text" id="numSocio" placeholder="Ej: 0001" required>

        <label>Contraseña Personal</label>
        <input type="password" id="passSocio" placeholder="Tu contraseña" required>

        <button type="submit">ENTRAR AL PANEL</button>
    </form>
</div>
</div>

<footer>
    Peña Taurina Peguerinos — Unidos por la afición
</footer>

<script>
const API = "https://script.google.com/macros/s/AKfycbxuR0UKh-au7EoIEufoHvazzfd9MejHEHidOrH2ifAUAvRMAdqF7KJJmk6FP4RFHSSt/exec";
const ADMIN_NUM = "0011";

async function validarAcceso(event) {
    event.preventDefault();

    const btn = document.querySelector("button[type='submit']");
    const textoOriginal = btn.innerText;
    btn.innerText = "Verificando...";
    btn.disabled = true;

    const numRaw = document.getElementById("numSocio").value.trim();
    const passIngresada = document.getElementById("passSocio").value.trim();
    const numFormateado = numRaw.padStart(4, '0');

    try {
        const res = await fetch(`${API}?action=getSocio&num=${numFormateado}&pin=${passIngresada}`);
        const data = await res.json();

        if (data.ok && data.socio) {
            const datosSesion = {
                num: numFormateado,
                nombre: data.socio.nombre,
                pin: passIngresada
            };
            localStorage.setItem("datos_sesion", JSON.stringify(datosSesion));

            if (numFormateado === ADMIN_NUM) {
                window.location.href = "panel-admin.html";
            } else {
                window.location.href = "panel-socio.html";
            }
        } else {
            alert("Número de socio o contraseña incorrectos.");
            btn.innerText = textoOriginal;
            btn.disabled = false;
        }
    } catch(e) {
        alert("Error de conexión. Inténtalo de nuevo.");
        btn.innerText = textoOriginal;
        btn.disabled = false;
    }
}
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
