<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Área de Socios - Peña Taurina Peguerinos</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4efe2;
        }

        header {
            background: linear-gradient(90deg, #7a0000, #b30000);
            padding: 25px 20px;
            color: white;
        }

        .cabecera-flex {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 1px;
            flex: 1;
            text-align: center;
        }

        .gif-cabecera {
            height: 60px;
            position: absolute;
            right: 10px;
        }

        nav {
            background-color: #d4af37;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: #7a0000;
            font-weight: bold;
            text-decoration: none;
            font-size: 17px;
        }

        nav a:hover {
            color: #4d0000;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.2);
        }

        h2 {
            color: #7a0000;
            margin-top: 0;
        }

        .boton {
            display: inline-block;
            padding: 10px 20px;
            background: #b30000;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 15px;
        }

        .boton:hover {
            background: #7a0000;
        }
    </style>
</head>

<body>

<header>
    <div class="cabecera-flex">
        <h1>Área de Socios</h1>
        <img src="../toro_enfadado.gif" class="gif-cabecera">
    </div>
</header>

<nav>
    <a href="../index.html">Inicio</a>
    <a href="perfil.html">Mi Perfil</a>
    <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
</nav>

<div class="contenedor">
    <h2>Bienvenido, <span id="nombreSocio">Cargando...</span></h2>

    <p>Acceso exclusivo para socios de la Peña Taurina Peguerinos.</p>

    <a href="perfil.html" class="boton">Ver mi perfil</a>
</div>

<footer>
    Peña Taurina Peguerinos — Unidos por la afición
</footer>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAdIeQH3zvgvF5rtSF35gnR58Gv9tC13Vg",
        authDomain: "peguerinos-taurino.firebaseapp.com",
        projectId: "peguerinos-taurino",
        storageBucket: "peguerinos-taurino.firebasestorage.app",
        messagingSenderId: "922129437003",
        appId: "1:922129437003:web:6d61cffcade066b8b498ce"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Verificar si el usuario está autenticado
    auth.onAuthStateChanged(async user => {
        if (!user) {
            window.location.href = "../acceso-socios.html";
            return;
        }

        // Buscar socio por teléfono
        const telefono = user.phoneNumber;

        const consulta = await db.collection("socios")
            .where("telefono", "==", telefono)
            .get();

        if (!consulta.empty) {
            const datos = consulta.docs[0].data();
            document.getElementById("nombreSocio").textContent = datos.nombre;
        } else {
            document.getElementById("nombreSocio").textContent = "Socio";
        }
    });

    function cerrarSesion() {
        auth.signOut().then(() => {
            window.location.href = "../acceso-socios.html";
        });
    }
</script>

</body>
</html>
